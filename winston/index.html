<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0b1e">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<title>Winston Study Buddy</title>
<style>
:root{color-scheme:dark;--bg:#0a0b1e;--ink:#e8ecff;--mute:#9aa3cf;--card:rgba(13,13,42,.66);--line:rgba(130,190,255,.22);--brand:#62f0ff;--brand2:#8d7cff;--ok:#7fe3a8;--bad:#ff8f8f;--soft:rgba(255,255,255,.08);--display:'Fredoka',system-ui,sans-serif}
*{box-sizing:border-box}
html{background:#0a0b1e}
body{margin:0;background:transparent;color:var(--ink);font:16px/1.45 'Instrument Sans',system-ui,sans-serif;padding-bottom:90px;min-height:100vh}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1;display:block}
main{max-width:680px;margin:0 auto;padding:14px}
.card{background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:24px;padding:16px;margin-bottom:14px;box-shadow:0 10px 30px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.08)}
h1,h2,h3{margin:0 0 8px;font-family:var(--display);font-weight:600;letter-spacing:.2px}h2{font-size:21px}h3{font-size:17px}
.glowtitle{font-size:30px;text-align:center;background:linear-gradient(90deg,#8ff7ff,#62f0ff,#b79cff,#ff7ad9);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 12px rgba(98,240,255,.45))}
.mute{color:var(--mute);font-size:14px}
button{font:inherit;cursor:pointer}
.p,.s{border-radius:99px;padding:10px 18px;border:2px solid var(--brand);transition:transform .15s,box-shadow .2s}
.p{background:linear-gradient(135deg,#7ef7ff,#8d7cff);color:#06102a;font-weight:700;box-shadow:0 0 18px rgba(98,240,255,.45)}
.s{background:rgba(255,255,255,.04);color:var(--brand)}
.p:hover,.s:hover{transform:translateY(-2px) scale(1.03)}
.p.ok{background:linear-gradient(135deg,#9af0bf,#5fcf95);border-color:#7fe3a8;color:#0c3a22;box-shadow:0 0 18px rgba(127,227,168,.4)}
.p.bad{background:#ff8f8f;border-color:#ff8f8f;color:#4a0f0f}
.p.purple{background:linear-gradient(135deg,#a79bff,#7c6cff);border-color:#a79bff;color:#fff;box-shadow:0 0 18px rgba(141,124,255,.45)}
input,select,textarea{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.07);color:var(--ink);margin:4px 0 10px;outline:none}
input:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(98,240,255,.2)}
::placeholder{color:#7f9b98}
textarea{min-height:90px}label{font-size:13px;color:var(--mute)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.grow{flex:1}
.chip{display:inline-block;padding:7px 13px;border-radius:99px;background:var(--soft);margin:3px;font-size:14px;border:2px solid transparent;cursor:pointer;transition:.2s}
.chip:hover{background:rgba(255,255,255,.14)}
.chip.on{border-color:var(--brand);box-shadow:0 0 14px rgba(98,240,255,.35);font-weight:600}
.stats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.stat{background:var(--soft);padding:6px 13px;border-radius:99px;font-weight:600;font-size:14px;border:1px solid var(--line)}
.bar{height:12px;background:rgba(255,255,255,.1);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#62f0ff,#8d7cff,#ff7ad9);box-shadow:0 0 12px rgba(98,240,255,.6);border-radius:8px}
.dogwrap{text-align:center}.dogwrap svg{max-width:260px;width:74%;animation:bob 3.2s ease-in-out infinite;filter:drop-shadow(0 8px 14px rgba(0,0,0,.35))}
@keyframes bob{50%{transform:translateY(-6px)}}
.stage{position:relative;padding-bottom:18px}
.stage::after,.stage::before{content:'';position:absolute;left:50%;bottom:6px;width:64%;height:30px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse,rgba(98,240,255,.38) 0%,rgba(141,124,255,.18) 55%,rgba(98,240,255,0) 72%);border:2px solid rgba(98,240,255,.75);box-shadow:0 0 26px rgba(98,240,255,.55),inset 0 0 14px rgba(98,240,255,.5);z-index:-1;animation:holo 3s ease-in-out infinite}
.stage::before{width:84%;height:42px;bottom:0;opacity:.4;animation:none}
@keyframes holo{50%{box-shadow:0 0 38px rgba(255,94,203,.6),inset 0 0 18px rgba(255,94,203,.4);border-color:rgba(255,122,217,.85)}}
.stage .lotus{position:absolute;right:12%;bottom:4px;font-size:32px;animation:sway 4s ease-in-out infinite}
.stage .fly{position:absolute;left:14%;top:18%;font-size:26px;animation:flit 7s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(6deg) translateY(-2px)}}
@keyframes flit{0%,100%{transform:translate(0,0) rotate(-8deg)}25%{transform:translate(26px,-22px) rotate(10deg)}50%{transform:translate(52px,6px) rotate(-6deg)}75%{transform:translate(20px,22px) rotate(8deg)}}
nav{position:fixed;bottom:10px;left:10px;right:10px;max-width:660px;margin:0 auto;background:rgba(11,11,36,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:26px;display:flex;justify-content:space-around;padding:6px 4px;z-index:5;box-shadow:0 8px 28px rgba(0,0,0,.35)}
nav button{border:0;background:none;color:var(--mute);font-size:11px;padding:4px 8px;border-radius:16px;transition:.2s}nav button b{display:block;font-size:21px;font-weight:400}
nav button.on{color:var(--brand);font-weight:700;background:rgba(98,240,255,.12);text-shadow:0 0 10px rgba(98,240,255,.6)}
.mat{display:block;padding:11px 13px;border:2px solid var(--line);border-radius:18px;margin:9px 0;transition:.4s;background:rgba(255,255,255,.04)}
.mat .term{position:relative;display:inline-block;font-family:var(--display);font-weight:600;font-size:17px}
.mat.glow{border-color:#62f0ff;background:rgba(98,240,255,.12);box-shadow:0 0 0 4px rgba(98,240,255,.22),0 0 30px rgba(98,240,255,.65);animation:pulse 1.3s ease-in-out 3;transform:scale(1.025)}
.mat.seen{border-color:rgba(127,227,168,.55)}
.circ{position:absolute;left:-14px;top:-9px;width:calc(100% + 28px);height:calc(100% + 18px);overflow:visible;pointer-events:none}
.circ path{fill:none;stroke:#ff5ecb;stroke-width:3.2;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:scribble .8s ease-out .1s forwards;filter:drop-shadow(0 0 4px rgba(255,94,203,.8))}
@keyframes scribble{to{stroke-dashoffset:0}}
@keyframes pulse{50%{box-shadow:0 0 0 9px rgba(98,240,255,.12),0 0 44px rgba(98,240,255,.95)}}
.step{display:flex;gap:10px;margin:11px 0}.step .n{flex:none;width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#a79bff,#7c6cff);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;box-shadow:0 0 12px rgba(141,124,255,.6)}
.opt{display:block;width:100%;text-align:left;margin:7px 0;padding:12px 14px;border-radius:16px;border:2px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);transition:.2s}
.opt:hover{border-color:var(--brand);background:rgba(98,240,255,.08)}
.opt.right{border-color:var(--ok)}.opt.wrong{border-color:var(--bad)}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1;padding:9px;border-radius:99px;border:1px solid var(--line);background:var(--soft);color:var(--ink)}.tabs .on{background:linear-gradient(135deg,#a79bff,#7c6cff);border-color:transparent;color:#fff;box-shadow:0 0 16px rgba(141,124,255,.5)}
.bubble{background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:18px;padding:10px 13px;margin:8px 0;font-size:15px;position:relative}
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.shopgrid .card{margin:0;text-align:center;padding:10px}.shopgrid svg{width:78px;height:62px}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#a79bff,#7c6cff);color:#fff;padding:10px 20px;border-radius:99px;z-index:50;opacity:0;transition:.3s;pointer-events:none;max-width:90vw;text-align:center;box-shadow:0 0 24px rgba(141,124,255,.7)}
#toast.on{opacity:1}
#widget{position:fixed;right:10px;bottom:92px;width:210px;background:linear-gradient(160deg,rgba(22,18,64,.96),rgba(10,10,32,.96));border:2px solid rgba(98,240,255,.7);border-radius:26px;padding:8px;z-index:20;box-shadow:0 0 30px rgba(98,240,255,.35),0 8px 28px rgba(0,0,0,.4);display:none;text-align:center;font-size:14px;color:var(--ink)}
#widget.show{display:block}
#widget svg{width:96px;height:96px}
body.live{padding-bottom:350px}
#widget.pip{position:static;width:100%;min-height:100vh;border-radius:0;border:0;box-shadow:none;display:block}
.paw{background:linear-gradient(135deg,#ff7ad9,#8d7cff);color:#fff;border-radius:18px;padding:12px;margin-top:8px;animation:pulse2 .8s infinite}
@keyframes pulse2{50%{transform:scale(1.05)}}
.paw button{font-size:20px;padding:10px 18px;border-radius:99px;border:0;background:#fff;color:#6b57e8;font-weight:800;margin-top:6px}
.hero{background:linear-gradient(135deg,rgba(98,240,255,.22),rgba(141,124,255,.3));border:1px solid var(--line);color:#fff;border-radius:24px;padding:16px;margin-bottom:14px;backdrop-filter:blur(10px)}
/* Winston animations */
.wag{transform-box:fill-box;transform-origin:8% 92%;animation:wag 1s ease-in-out infinite}@keyframes wag{50%{transform:rotate(10deg)}}
.earR{transform-box:fill-box;transform-origin:25% 100%;animation:twitch 6s infinite}@keyframes twitch{0%,90%,100%{transform:none}93%{transform:rotate(-9deg)}96%{transform:rotate(3deg)}}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}@keyframes blink{0%,94%,100%{transform:none}97%{transform:scaleY(.1)}}
.spk{transform-box:fill-box;transform-origin:center;animation:tw 2.4s ease-in-out infinite}@keyframes tw{50%{opacity:.2;transform:scale(.45) rotate(45deg)}}
.hrt{transform-box:fill-box;transform-origin:center;animation:rise 3.4s ease-in infinite}@keyframes rise{0%{opacity:0;transform:translateY(8px) scale(.6)}30%{opacity:1}100%{opacity:0;transform:translateY(-28px) scale(1.1)}}
.dogwrap svg.hop{animation:hop .65s ease-out}@keyframes hop{30%{transform:translateY(-24px) scale(1.05)}60%{transform:translateY(0) scaleY(.93)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg id="defs" width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<radialGradient id="fur" cx=".4" cy=".3" r=".8"><stop offset="0" stop-color="#ffcf8e"/><stop offset=".55" stop-color="#f6a65a"/><stop offset="1" stop-color="#d9813b"/></radialGradient>

<linearGradient id="wing" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d4fbff" stop-opacity=".95"/><stop offset="1" stop-color="#e6c8ff" stop-opacity=".65"/></linearGradient>
</defs></svg>
<canvas id="bg"></canvas>
<main id="main"></main>
<nav id="nav"></nav>

<script>

   Google sign-in: create an OAuth Web client ID at console.cloud.google.com
   (APIs & Services > Credentials), add your site URL as an authorized JS origin,

const GOOGLE_CLIENT_ID='';

/* ======= helpers ======= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const norm=s=>String(s).toLowerCase().replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();
const shuffle=a=>[...a].sort(()=>Math.random()-.5);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2600)}

/* ======= state ======= */
const KEY='winston.v1';
const DEMO={id:'demo',name:'Intro to Business (demo)',careerNotes:{},sessions:[],items:[
 ['Opportunity cost','The value of the next-best alternative you give up when you make a choice. Every choice has one.'],
 ['Revenue','The total money a business earns from selling goods or services. It is counted before any expenses are subtracted.'],
 ['Profit','Revenue minus all expenses. If it is negative, the business has a loss.'],
 ['Stakeholder','Any person or group affected by a company\'s actions. Examples are customers, employees, and investors.'],
 ['Market segmentation','Dividing a market into groups of customers with similar needs. It lets a company aim its message at the right people.'],
 ['Supply and demand','Prices rise when demand is higher than supply. Prices fall when supply is higher than demand.']
].map(([term,text])=>({id:uid(),term,text}))};
let S=load();let joy=0;
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.v===1)return s}catch(e){}
 return {v:1,user:null,coins:0,earned:0,happy:70,tick:Date.now(),owned:[],eq:{},classes:[DEMO],friends:[],checks:0}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
// Winston gets a little lonelier while you are away (gentle: never below 15).
(function decay(){const h=(Date.now()-S.tick)/36e5;S.happy=Math.max(15,Math.min(S.happy,100)-h*1.5);S.tick=Date.now();save()})();

const lvl=()=>Math.floor(Math.sqrt(S.earned/15))+1;
function earn(n,why){const before=lvl();S.coins+=n;S.earned+=n;S.happy=Math.min(100,S.happy+n*1.5);save();
 toast(`+${n} 🪙 ${why}`);if(lvl()>before)setTimeout(()=>{toast(`🎉 Level ${lvl()}! Winston is so proud!`);burst(44)},2700);refresh();joy=Date.now();setTimeout(()=>burst(8+Math.min(n,8)),80)}
const mood=()=>S.happy>=65?'happy':S.happy>=35?'ok':'sad';

 beanie:{slot:'hat',name:'Cozy beanie',price:15,svg:'<path d="M62 58 Q64 14 100 12 Q136 14 138 58Z" fill="url(#blue)" stroke="#264aa8" stroke-width="1.5"/><path d="M76 58V22M88 58V16M100 58V14M112 58V16M124 58V22" stroke="#2a54b8" stroke-opacity=".45" stroke-width="2"/><rect x="58" y="52" width="84" height="12" rx="6" fill="#fff" stroke="#c9d6f2" stroke-width="1.5"/><circle cx="100" cy="10" r="10" fill="#fff" stroke="#c9d6f2" stroke-width="1.5"/>'},
 crown:{slot:'hat',name:'Gold crown',price:40,svg:'<path d="M68 56 L72 20 L88 40 L100 12 L112 40 L128 20 L132 56Z" fill="url(#gold)" stroke="#b97a00" stroke-width="2" stroke-linejoin="round"/><rect x="68" y="52" width="64" height="8" rx="3" fill="url(#gold)" stroke="#b97a00" stroke-width="1.5"/><circle cx="100" cy="36" r="5" fill="#ff4d6d"/><circle cx="82" cy="46" r="3.5" fill="#6cb2ff"/><circle cx="118" cy="46" r="3.5" fill="#7fe3a8"/><circle cx="72" cy="18" r="3" fill="#fff"/><circle cx="128" cy="18" r="3" fill="#fff"/>'},
 wizard:{slot:'hat',name:'Wizard hat',price:30,svg:'<path d="M100 -14 Q96 24 70 56 H130 Q110 30 112 6 Q108 -4 100 -14Z" fill="url(#purp)" stroke="#4b33b8" stroke-width="1.5"/><ellipse cx="100" cy="56" rx="48" ry="9" fill="url(#purp)" stroke="#4b33b8" stroke-width="1.5"/><rect x="78" y="44" width="44" height="7" rx="3" fill="#ffd36b"/><g fill="#ffe9a8"><path transform="translate(98 22) scale(.9)" d="'+STAR+'"/><path transform="translate(108 38) scale(.55)" d="'+STAR+'"/><path transform="translate(90 40) scale(.5)" d="'+STAR+'"/></g>'},
 flowers:{slot:'hat',name:'Flower crown',price:25,svg:(()=>{let o='<path d="M54 74 Q100 22 146 74" fill="none" stroke="#3f8f62" stroke-width="5" stroke-linecap="round"/>';[[58,68,'#ff9fc4'],[72,48,'#fff'],[88,36,'#ffd36b'],[104,32,'#ff9fc4'],[120,38,'#fff'],[134,50,'#ffd36b'],[144,68,'#ff9fc4']].forEach(([x,y,c])=>{for(let k=0;k<5;k++){const a=k/5*6.283;o+=`<circle cx="${(x+5*Math.cos(a)).toFixed(1)}" cy="${(y+5*Math.sin(a)).toFixed(1)}" r="4.2" fill="${c}" stroke="#00000022"/>`}o+=`<circle cx="${x}" cy="${y}" r="3.2" fill="#ffb300"/>`});return o})()},
 glasses:{slot:'face',name:'Round glasses',price:15,svg:'<g fill="rgba(180,230,255,.18)" stroke="#2b2233" stroke-width="3.2"><circle cx="78" cy="101" r="14"/><circle cx="122" cy="101" r="14"/><path d="M92 99 Q100 94 108 99" fill="none"/></g><path d="M70 94 Q74 90 80 91M114 94 Q118 90 124 91" stroke="#fff" stroke-opacity=".8" stroke-width="2.4" fill="none" stroke-linecap="round"/>'},
 shades:{slot:'face',name:'Cool shades',price:25,svg:'<path d="M62 91 H94 Q92 112 78 112 Q64 112 62 91Z M106 91 H138 Q136 112 122 112 Q108 112 106 91Z" fill="#14101d" stroke="#000" stroke-width="1.5"/><path d="M94 95 H106" stroke="#14101d" stroke-width="4"/><path d="M68 96 L76 96M112 96 L120 96" stroke="#8d7cff" stroke-width="2.5" stroke-linecap="round" opacity=".8"/>'},
 hearts:{slot:'face',name:'Heart glasses',price:20,svg:'<g fill="url(#pink)" stroke="#b62d6d" stroke-width="2"><path d="M78 114 C60 104 62 90 72 90 Q78 90 78 97 Q78 90 84 90 C94 90 96 104 78 114Z"/><path d="M122 114 C104 104 106 90 116 90 Q122 90 122 97 Q122 90 128 90 C138 90 140 104 122 114Z"/></g><path d="M94 98 H106" stroke="#b62d6d" stroke-width="3"/><circle cx="71" cy="95" r="2.4" fill="#fff" opacity=".85"/><circle cx="115" cy="95" r="2.4" fill="#fff" opacity=".85"/>'},

 $('#livemat').innerHTML=c.items.map(i=>`<div class="mat ${live.focus===i.id?'glow':''} ${live.hits.some(h=>h.id===i.id)?'seen':''}" id="m${i.id}"><span class="term">${esc(i.term)}${live.focus===i.id?CIRC:''}</span><br><span class="mute">${esc(i.text)}</span></div>`).join('');
 $('#livelog').innerHTML=live.lines.slice(-4).map(l=>`<div>“${esc(l)}”</div>`).join('');
 const f=$('#m'+live.focus);if(f)f.scrollIntoView({block:'center',behavior:'smooth'})}
const STOP=new Set('about their there these those which would could should where while other being because'.split(' '));
function matches(item,t){const T=norm(item.term);if(t.includes(T))return true;
 const kw=[...new Set(norm(item.text).split(' ').filter(w=>w.length>4&&!STOP.has(w)))];
 return kw.filter(w=>t.includes(w.slice(0,5))).length>=2}
function heard(line){if(!live)return;const c=cur(),t=norm(line);live.lines.push(line);
 const hit=c.items.find(i=>matches(i,t));
 if(hit){live.focus=hit.id;if(!live.hits.some(h=>h.id===hit.id))live.hits.push({id:hit.id,line})}
 paintLive();updateWidget();if(hit)setTimeout(()=>burst(7,$('#m'+hit.id)),60)}
Object.assign(ACTIONS,{
 startlive(){const c=cur();live={cls:c.id,hits:[],lines:[],focus:null,listening:false,t0:Date.now()};schedulePaw();updateWidget();render()},
 say(){const v=$('#said').value.trim();if(!v)return;$('#said').value='';heard(v)},
 mic(){if(live.listening){live.listening=false;try{rec.stop()}catch(e){}}else startListen();render()},
 popout:popOut,
 testpaw:()=>showPaw(),
 endlive(){const c=cur();clearTimeout(pawT);if(rec){live.listening=false;try{rec.stop()}catch(e){}}
  const n=live.hits.length;
  c.sessions.push({id:uid(),date:new Date().toLocaleString(),hits:live.hits,lines:live.lines});
  live=null;document.body.classList.remove('live');$('#widget').className='';$('#widget').innerHTML='';
  const out=Math.min(20,n*2);if(out)earn(out,`for engaging in class (${n} topics)`);save();view.sub='recap';render()}
});
function startListen(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR)return toast('This browser has no speech recognition — type what was said instead.');
 rec=new SR();rec.continuous=true;rec.interimResults=false;rec.lang='en-US';
 rec.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)heard(e.results[i][0].transcript)};
 rec.onend=()=>{if(live&&live.listening)try{rec.start()}catch(e){}};
 try{rec.start();live.listening=true}catch(e){toast('Could not start the mic')}}

function sentences(t){const s=t.split(/(?<=[.!?])\s+/).map(x=>x.trim()).filter(Boolean);return s.length?s:[t]}
function rRecap(c){
 const ses=c.sessions[c.sessions.length-1];
 const items=ses?ses.hits.map(h=>({it:c.items.find(i=>i.id===h.id),line:h.line})).filter(x=>x.it):c.items.map(it=>({it}));
 let n=0;
 $('#sub').innerHTML=`<div class="card"><h2>${ses?'Recap · '+esc(ses.date):'Primer from your materials'}</h2>
 <p class="mute">${ses?'Here\'s what happened, one small step at a time. No stress — you only need to understand one step at a time. 💛':'No live class recorded yet, so here\'s a gentle walkthrough of your materials.'}</p>
 ${items.map(({it,line})=>`<div class="step"><div class="n">${++n}</div><div><b>${esc(it.term)}</b>${line?`<div class="mute">Teacher: “${esc(line)}”</div>`:''}<ol style="margin:6px 0 0;padding-left:18px">${sentences(it.text).map(s=>`<li>${esc(s)}</li>`).join('')}</ol></div></div>`).join('')||'<p class="mute">Nothing was matched in that class — try adding the materials, then use the “Teacher said” box next time.</p>'}
 <button class="p purple" data-a="pc" data-k="${c.id}">✏️ Practice this class</button></div>
 <div class="card"><h3>🐶 Ask Winston anything about this class</h3><div class="row"><input class="grow" id="ask" placeholder="e.g. what's the difference between revenue and profit?"><button class="p" data-a="ask">Ask</button></div><div id="ans"></div></div>`;
}
Object.assign(ACTIONS,{pc(d){tab='practice';startPractice(d.k)},
 ask(){const c=cur(),q=norm($('#ask').value);if(!q)return;
  const qw=q.split(' ').filter(w=>w.length>2&&!STOP.has(w));
  const pool=[...c.items.map(i=>({t:i.term,s:i.text})),...c.sessions.flatMap(s=>s.lines.map(l=>({t:'Teacher said',s:l})))];
  const sc=pool.map(p=>({p,n:qw.filter(w=>norm(p.t+' '+p.s).includes(w.slice(0,5))).length})).filter(x=>x.n>0).sort((a,b)=>b.n-a.n).slice(0,3);
  $('#ans').innerHTML=sc.length?`<p class="bubble">Woof! Here's how I'd explain it, step by step:</p>`+sc.map((x,i)=>`<div class="step"><div class="n">${i+1}</div><div><b>${esc(x.p.t)}</b><br>${esc(x.p.s)}</div></div>`).join('')+`<p class="mute">Still fuzzy? Ask me again with different words, or try the practice questions.</p>`
   :`<p class="bubble">Hmm, I couldn't find that in this class's materials or what your teacher said. Add it to Materials and I'll learn it too! 🐾</p>`}});

function rPractice(){
 if(!P){$('#main').innerHTML=`<div class="card"><h2>Practice with Winston</h2><p class="mute">Correct answers earn 5 🪙. Miss one? Walk through my step-by-step explanation and you'll still earn 3 🪙.</p>
 <button class="p purple" data-a="pall" style="width:100%;margin-bottom:8px">All classes mixed</button>
 ${classes().map(c=>`<button class="s" style="width:100%;margin:4px 0" data-a="pc" data-k="${c.id}">${esc(c.name)}</button>`).join('')}</div>`;return}
 if(P.done){$('#main').innerHTML=`<div class="card dogwrap"><div class="dogwrap">${dog(S.eq,'happy')}</div><h2>Round complete! 🎉</h2><p>${P.right} first-try correct · ${P.walked} learned with my help.<br>You earned <b>${P.coins} 🪙</b>.</p><button class="p" data-a="again">Another round</button> <button class="s" data-a="tab" data-k="home">Home</button></div>`;return}
 const q=P.qs[P.i];let body='';
 if(P.phase==='ask'){
  body=`<span class="chip on">${{mc:'Multiple choice',fill:'Fill in the blank',open:'Open answer'}[q.type]}</span><h3 style="margin-top:8px">${esc(q.prompt)}</h3>`+
   (q.type==='mc'?q.choices.map((ch,i)=>`<button class="opt" data-a="mcpick" data-k="${i}">${esc(ch)}</button>`).join('')
   :(q.type==='open'?'<textarea id="ans" placeholder="Type your answer"></textarea>':'<input id="ans" placeholder="Type your answer">')+`<button class="p" data-a="submit">Check</button>`)}
 if(P.phase==='walk'){const st=q.steps;
  body=`<p class="bubble">Not quite — and that's totally fine! Let's walk through it together. 🐾</p><h3>Step ${P.step+1} of ${st.length}</h3><div class="step"><div class="n">${P.step+1}</div><div>${esc(st[P.step])}</div></div><button class="p" data-a="nextstep">${P.step+1<st.length?'Got it, next step':'Got it — try again'}</button>`}
 if(P.phase==='retry'){body=`<p class="bubble">Now that we've walked through it: ${esc(q.retry)}</p><input id="ans" placeholder="Type your answer">${P.hint?`<p class="mute">Hint: starts with “${esc(q.answer[0])}”</p>`:''}<button class="p" data-a="retrysub">Check</button>`}
 if(P.phase==='fb'){body=`<p class="bubble">${P.msg}</p><button class="p" data-a="nextq">${P.i+1<P.qs.length?'Next question':'Finish'}</button>`}
 $('#main').innerHTML=`<div class="row" style="margin-bottom:6px"><span class="mute grow">Question ${P.i+1} of ${P.qs.length}</span><span class="stat">🪙 ${S.coins}</span></div><div class="card">${body}</div>`;
 const a=$('#ans');if(a)a.focus();
}
function startPractice(clsId){
 const pool=clsId==='all'?allItems():allItems().filter(i=>i.cls===clsId);
 if(!pool.length){tab='practice';return toast('Add materials to a class first!')}
 const every=allItems().map(i=>i.text);
 const qs=shuffle(pool).slice(0,8).map((it,idx)=>{
  let type=['mc','fill','open'][idx%3];
  const others=shuffle(every.filter(t=>t!==it.text)).slice(0,3);
  if(type==='mc'&&others.length<3)type='fill';
  const short=t=>t.length>120?t.slice(0,117)+'…':t;
  const steps=sentences(it.text);if(steps.length<2)steps.push(`The key term here is “${it.term}”.`);
  const q={item:it,type,steps,answer:it.term,retry:`what is this describing? “${it.text}”`};
  if(type==='mc'){q.prompt=`Which best describes “${it.term}”?`;q.choices=shuffle([it.text,...others]).map(short);q.right=short(it.text)}
  if(type==='fill'){const re=new RegExp(it.term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig');const t=it.text.replace(re,'_____');
   q.prompt=t.includes('_____')?t:`_____ : ${it.text}`}
  if(type==='open'){q.prompt=`In your own words, what is “${it.term}”?`}
  return q});
 P={qs,i:0,phase:'ask',step:0,right:0,walked:0,coins:0,scope:clsId};render()}
function okFill(a,b){a=norm(a);b=norm(b);if(!a)return false;if(a===b)return true;return a.length>5&&lev(a,b)<=1}
function lev(a,b){const d=[...Array(a.length+1)].map((_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;
 for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
function okOpen(ans,q){const a=norm(ans);if(a.length<3)return false;
 const kw=[...new Set(norm(q.item.text).split(' ').filter(w=>w.length>4&&!STOP.has(w)))];if(!kw.length)return okFill(ans,q.answer);
 const hit=kw.filter(w=>a.includes(w.slice(0,5))).length;return hit>=Math.max(1,Math.ceil(kw.length*.3))}
function grade(ok){const q=P.qs[P.i];
 if(ok){P.right++;P.coins+=5;earn(5,'correct!');P.phase='fb';P.msg='✅ Yes! '+(q.type==='open'?`Model answer: ${esc(q.item.text)}`:'Nice one.')}
 else{P.phase='walk';P.step=0}render()}
Object.assign(ACTIONS,{
 pall(){startPractice('all')},again(){startPractice(P.scope)},
 mcpick(d){const q=P.qs[P.i];grade(q.choices[+d.k]===q.right)},
 submit(){const q=P.qs[P.i],v=$('#ans').value;if(!v.trim())return;grade(q.type==='fill'?okFill(v,q.answer):okOpen(v,q))},
 nextstep(){const q=P.qs[P.i];if(P.step+1<q.steps.length)P.step++;else{P.phase='retry';P.hint=false}render()},
 retrysub(){const q=P.qs[P.i];if(okFill($('#ans').value,q.answer)){P.walked++;P.coins+=3;earn(3,'you worked it out!');P.phase='fb';P.msg=`✅ That's it — <b>${esc(q.answer)}</b>! You figured it out with me. I'm proud of you. 🐶`}else{P.hint=true;toast('Almost — check the hint!')}render()},
 nextq(){if(P.i+1<P.qs.length){P.i++;P.phase='ask'}else P.done=true;render()}
});

function burst(n=14,el){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const r=(el||document.querySelector('.dogwrap svg')||document.body).getBoundingClientRect();const cx=r.left+r.width/2,cy=r.top+Math.min(r.height*.4,60);

(function(){const cv=$('#bg'),g=cv.getContext('2d'),RM=matchMedia('(prefers-reduced-motion: reduce)').matches,TAU=Math.PI*2,rnd=Math.random;
 let W,H,D,rip=[],last=0,comets=[],pulses=[];
 const small=innerWidth<600;

 const CH='ᚠᚢᚦᚨᚱᚲᚷᚹ{}</>01λΣπ∞⌘'.split('');
 const glyphs=[...Array(small?12:20)].map(()=>({x:rnd(),y:rnd(),sp:.02+rnd()*.03,ch:CH[rnd()*CH.length|0],c:rnd()<.5?'98,240,255':rnd()<.5?'255,122,217':'170,150,255',sz:12+rnd()*14,p:rnd()*TAU}));
 function size(){D=Math.min(devicePixelRatio||1,1.5);W=cv.width=Math.round(innerWidth*D);H=cv.height=Math.round(innerHeight*D);if(RM)draw(0)}
 addEventListener('resize',size);size();
 document.addEventListener('pointerdown',e=>{rip.push({x:e.clientX*D,y:e.clientY*D,r:4,a:.6})},{passive:true});
 function sigil(t){const R=Math.min(W,H)*.46;g.save();g.translate(W*.5,H*.36);g.lineWidth=1.3*D;g.shadowColor='rgba(98,240,255,.8)';g.shadowBlur=10*D;
