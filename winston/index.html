<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#bfeaff">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<title>Winston Study Buddy</title>
<style>
:root{color-scheme:light;--bg:#bfeaff;--ink:#4a3426;--mute:#8a7260;--card:rgba(255,252,240,.95);--line:#ffb3d1;--brand:#ff9a3d;--brand2:#ff6fa8;--ok:#3fb84c;--bad:#e0504d;--soft:#fff0c2;--display:'Fredoka',system-ui,sans-serif}
*{box-sizing:border-box}
html{background:#bfeaff}
body{margin:0;background:transparent;color:var(--ink);font:16px/1.45 'Instrument Sans',system-ui,sans-serif;padding-bottom:96px;min-height:100vh}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1;display:block}
main{max-width:680px;margin:0 auto;padding:14px}
.card{background:var(--card);border:3px dotted var(--line);border-radius:26px;padding:16px;margin-bottom:14px;box-shadow:0 5px 0 rgba(255,150,190,.35),0 12px 22px rgba(60,120,160,.18)}
h1,h2,h3{margin:0 0 8px;font-family:var(--display);font-weight:600;letter-spacing:.2px}h2{font-size:21px}h3{font-size:17px}
.sign{display:block;margin:2px auto 14px;width:max-content;max-width:100%;padding:6px 30px 8px;background:linear-gradient(#e0a050,#b8742e);border:4px solid #8a521f;border-radius:18px;color:#fff6dd;font-size:32px;text-shadow:0 2px 0 #8a521f;box-shadow:0 5px 0 #6e3f14,inset 0 2px 0 rgba(255,255,255,.35);position:relative}
.sign::before,.sign::after{content:'';position:absolute;top:8px;width:8px;height:8px;border-radius:50%;background:#6e3f14;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.sign::before{left:9px}.sign::after{right:9px}
.mute{color:var(--mute);font-size:14px}
button{font:inherit;cursor:pointer}
.p,.s{border-radius:18px;padding:10px 18px;transition:transform .12s,box-shadow .12s}
.p{background:linear-gradient(#97ee78,#4cc455);color:#fff;border:3px solid #2f9a3a;text-shadow:0 1px 0 #2f9a3a;font-weight:700;box-shadow:0 4px 0 #2f9a3a}
.s{background:#fff7e0;color:#c4691a;border:3px solid #f5b25a;box-shadow:0 3px 0 #f5b25a;font-weight:600}
.p:active,.s:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.p.ok{background:linear-gradient(#97ee78,#4cc455)}
.p.bad{background:linear-gradient(#ff8f8a,#e0504d);border-color:#b02f2c;box-shadow:0 4px 0 #b02f2c;text-shadow:0 1px 0 #b02f2c}
.p.purple{background:linear-gradient(#ffa9cc,#ff6fa8);border-color:#d94d86;box-shadow:0 4px 0 #d94d86;text-shadow:0 1px 0 #d94d86}
input,select,textarea{width:100%;font:inherit;padding:11px 12px;border:2px solid #f1d9b5;border-radius:14px;background:#fff;color:var(--ink);margin:4px 0 10px;outline:none}
input:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(255,154,61,.25)}
::placeholder{color:#b9a48f}
textarea{min-height:90px}label{font-size:13px;color:var(--mute)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.grow{flex:1}
.chip{display:inline-block;padding:7px 13px;border-radius:99px;background:var(--soft);margin:3px;font-size:14px;border:2px solid #f6d57a;cursor:pointer;transition:.15s}
.chip:hover{background:#ffe9a0}
.chip.on{border-color:var(--brand2);background:#ffe0ee;font-weight:600}
.stats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.stat{background:#fff;padding:6px 13px;border-radius:99px;font-weight:600;font-size:14px;border:2px solid #ffd9a0}
.bar{height:15px;background:#f1e3c6;border:2px solid #e2cba0;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(#97ee78,#4cc455);box-shadow:inset 0 3px 0 rgba(255,255,255,.45);border-radius:8px}
.dogwrap{text-align:center}.dogwrap svg{max-width:270px;width:76%;animation:bob 3.2s ease-in-out infinite;filter:drop-shadow(0 8px 8px rgba(80,60,20,.22))}
@keyframes bob{50%{transform:translateY(-5px)}}
.stage{position:relative;padding-bottom:20px}
.stage::after,.stage::before{content:'';position:absolute;left:50%;transform:translateX(-50%);border-radius:50%;z-index:-1}
.stage::after{bottom:6px;width:72%;height:36px;background:radial-gradient(ellipse,#86dc6e 0%,#52b94e 68%,rgba(82,185,78,0) 74%)}
.stage::before{bottom:0;width:92%;height:48px;background:radial-gradient(ellipse,rgba(255,255,255,.7),rgba(255,255,255,0) 70%)}
.stage .lotus{position:absolute;right:11%;bottom:8px;font-size:30px;animation:sway 4s ease-in-out infinite}
.stage .fly{position:absolute;left:12%;top:18%;font-size:26px;animation:flit 7s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(6deg) translateY(-2px)}}
@keyframes flit{0%,100%{transform:translate(0,0) rotate(-8deg)}25%{transform:translate(26px,-22px) rotate(10deg)}50%{transform:translate(52px,6px) rotate(-6deg)}75%{transform:translate(20px,22px) rotate(8deg)}}
nav{position:fixed;bottom:10px;left:10px;right:10px;max-width:660px;margin:0 auto;background:linear-gradient(#dba256,#b8742e);border:4px solid #8a521f;border-radius:24px;display:flex;justify-content:space-around;padding:5px 4px;z-index:5;box-shadow:0 5px 0 #6e3f14,0 12px 22px rgba(0,0,0,.2)}
nav button{border:0;background:none;color:#fff2d0;font-size:11px;padding:4px 8px;border-radius:16px;text-shadow:0 1px 0 #8a521f}nav button b{display:block;font-size:21px;font-weight:400}
nav button.on{background:#fff3cf;color:#a85a10;font-weight:700;text-shadow:none;box-shadow:inset 0 -3px 0 #f0cf86}
.mat{display:block;padding:11px 13px;border:3px solid #f3e1bd;border-radius:18px;margin:9px 0;transition:.4s;background:#fff}
.mat .term{position:relative;display:inline-block;font-family:var(--display);font-weight:600;font-size:17px}
.mat.glow{border-color:#ffb300;background:#fff8d6;box-shadow:0 0 0 4px rgba(255,200,60,.4),0 0 26px rgba(255,190,40,.85);animation:pulse 1.3s ease-in-out 3;transform:scale(1.025)}
.mat.seen{border-color:#7bd36a}
.circ{position:absolute;left:-14px;top:-9px;width:calc(100% + 28px);height:calc(100% + 18px);overflow:visible;pointer-events:none}
.circ path{fill:none;stroke:#ff4f6d;stroke-width:3.2;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:scribble .8s ease-out .1s forwards}
@keyframes scribble{to{stroke-dashoffset:0}}
@keyframes pulse{50%{box-shadow:0 0 0 9px rgba(255,200,60,.2),0 0 40px rgba(255,190,40,1)}}
.step{display:flex;gap:10px;margin:11px 0}.step .n{flex:none;width:30px;height:30px;border-radius:50%;background:linear-gradient(#ffa9cc,#ff6fa8);border:2px solid #d94d86;color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;text-shadow:0 1px 0 #d94d86}
.opt{display:block;width:100%;text-align:left;margin:7px 0;padding:12px 14px;border-radius:16px;border:3px solid #f3e1bd;background:#fff;color:var(--ink);transition:.15s}
.opt:hover{border-color:var(--brand);background:#fff6e6}
.opt.right{border-color:var(--ok);background:#e8ffe6}.opt.wrong{border-color:var(--bad);background:#ffe9e8}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1;padding:9px;border-radius:99px;border:2px solid #f6d57a;background:var(--soft);color:var(--ink);font-weight:600}.tabs .on{background:linear-gradient(#ffa9cc,#ff6fa8);border-color:#d94d86;color:#fff}
.bubble{background:#fff;border:2px solid #f1d9b5;border-radius:18px;padding:10px 13px;margin:8px 0;font-size:15px;position:relative}
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.shopgrid .card{margin:0;text-align:center;padding:10px}.shopgrid svg{width:78px;height:62px}
.item{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:2px dotted #f1d9b5}.item>div{flex:1;min-width:0;overflow-wrap:anywhere}
.upl{display:block;border:3px dashed #f5b25a;border-radius:22px;padding:18px;text-align:center;background:#fff9e8;cursor:pointer;color:var(--ink)}
.upl.drag{border-color:var(--brand2);background:#ffe9f3}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:linear-gradient(#ffa9cc,#ff6fa8);color:#fff;border:3px solid #d94d86;padding:9px 20px;border-radius:99px;z-index:50;opacity:0;transition:.3s;pointer-events:none;max-width:90vw;text-align:center;font-weight:600;text-shadow:0 1px 0 #d94d86;box-shadow:0 4px 0 #d94d86}
#toast.on{opacity:1}
#widget{position:fixed;right:10px;bottom:96px;width:210px;background:#fffaf0;border:4px solid #ff9a3d;border-radius:26px;padding:8px;z-index:20;box-shadow:0 5px 0 #c4691a,0 12px 24px rgba(0,0,0,.25);display:none;text-align:center;font-size:14px;color:var(--ink)}
#widget.show{display:block}
#widget svg{width:96px;height:96px}
body.live{padding-bottom:350px}
#widget.pip{position:static;width:100%;min-height:100vh;border-radius:0;border:0;box-shadow:none;display:block}
.paw{background:linear-gradient(135deg,#ffb347,#ff6fa8);color:#fff;border-radius:18px;padding:12px;margin-top:8px;animation:pulse2 .8s infinite;font-weight:600}
@keyframes pulse2{50%{transform:scale(1.05)}}
.paw button{font-size:20px;padding:10px 18px;border-radius:99px;border:0;background:#fff;color:#e0508a;font-weight:800;margin-top:6px}
.hero{background:linear-gradient(135deg,#ffe08a,#ffb3d1);border:3px dotted #fff;color:var(--ink);border-radius:26px;padding:16px;margin-bottom:14px;box-shadow:0 5px 0 rgba(255,150,190,.4)}
.wag{transform-box:fill-box;transform-origin:8% 92%;animation:wag 1s ease-in-out infinite}@keyframes wag{50%{transform:rotate(10deg)}}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}@keyframes blink{0%,94%,100%{transform:none}97%{transform:scaleY(.1)}}
.spk{transform-box:fill-box;transform-origin:center;animation:tw 2.4s ease-in-out infinite}@keyframes tw{50%{opacity:.2;transform:scale(.45) rotate(45deg)}}
.hrt{transform-box:fill-box;transform-origin:center;animation:rise 3.4s ease-in infinite}@keyframes rise{0%{opacity:0;transform:translateY(8px) scale(.6)}30%{opacity:1}100%{opacity:0;transform:translateY(-28px) scale(1.1)}}
.dogwrap svg.hop{animation:hop .65s ease-out}@keyframes hop{30%{transform:translateY(-24px) scale(1.05)}60%{transform:translateY(0) scaleY(.93)}}
.card{position:relative}
.tabs{overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px}.tabs button{flex:none;padding:9px 14px;white-space:nowrap}
#modal{position:fixed;inset:0;z-index:80;background:rgba(60,40,20,.45);display:none;justify-content:center;padding:14px;overflow:auto}
#modal.on{display:flex}
.sheet{background:#fffaf0;border:4px solid #ff9a3d;border-radius:28px;max-width:520px;width:100%;margin:auto;padding:18px;position:relative;box-shadow:0 8px 0 #c4691a,0 20px 40px rgba(0,0,0,.3)}
.sheet.calm{background:linear-gradient(#e8f6ff,#f3ecff);border-color:#8fc7ff;box-shadow:0 8px 0 #5aa0e0,0 20px 40px rgba(0,0,0,.25)}
.gear{position:absolute;top:8px;right:10px;border:0;background:none;font-size:22px;padding:6px;line-height:1;z-index:2;cursor:pointer}
#intro{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;background:radial-gradient(ellipse at 50% 40%,#fffbea,#ffe9ae);transition:opacity .6s}
#intro.out{opacity:0;pointer-events:none}
#intro svg{width:min(62vw,280px);animation:introhop 1.1s ease-out}
@keyframes introhop{0%{transform:translateY(60px) scale(.6);opacity:0}60%{transform:translateY(-18px) scale(1.05);opacity:1}100%{transform:none}}
.gamegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gcard{aspect-ratio:1/1.05;border-radius:16px;border:3px solid #f5b25a;background:linear-gradient(#ffd27a,#ffb347);display:grid;place-items:center;font-size:30px;padding:4px;cursor:pointer;font-weight:600;color:#fff;overflow:hidden;text-align:center;line-height:1.15}
.gcard.open{background:#fff;color:var(--ink);font-size:12.5px;border-color:#ff6fa8}
.gcard.done{background:#e8ffe6;border-color:#3fb84c;color:var(--ink);font-size:12.5px;opacity:.9;cursor:default}
.breath{width:180px;height:180px;margin:26px auto;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#a8d8ff 60%,#78b8f0);box-shadow:0 0 40px rgba(120,184,240,.7);display:grid;place-items:center;font-family:var(--display);font-size:20px;color:#2c5f8a;transition:transform 4s ease-in-out;text-align:center;padding:10px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .dow{font-size:11px;color:var(--mute);font-weight:700}
.cal .day{aspect-ratio:1;border-radius:12px;background:#fff;border:2px solid #f3e1bd;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
.cal .day.today{border-color:var(--brand2);background:#ffe9f3}.cal .day.sel{border-color:var(--brand);box-shadow:0 0 0 3px rgba(255,154,61,.35)}.cal .day.other{opacity:.35}
.dots{display:flex;gap:2px;margin-top:1px;min-height:6px}.dots i{width:6px;height:6px;border-radius:50%;display:block}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
#timerchip{position:fixed;top:10px;left:10px;z-index:30;background:linear-gradient(#97ee78,#4cc455);color:#fff;border:3px solid #2f9a3a;border-radius:99px;padding:4px 14px;font-weight:700;display:none;cursor:pointer;box-shadow:0 3px 0 #2f9a3a;text-shadow:0 1px 0 #2f9a3a;font-size:14px}
.excited{animation:shake .5s ease-in-out 3}@keyframes shake{25%{transform:rotate(-2deg) scale(1.03)}75%{transform:rotate(2deg) scale(1.03)}}
.nbox{white-space:pre-wrap;background:#fff;border:2px solid #f1d9b5;border-radius:14px;padding:10px 12px;font-size:14px;max-height:260px;overflow:auto;margin-top:6px}
a{color:#c4691a;font-weight:600}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
/* ======= CONFIG =======
   Google sign-in: create an OAuth Web client ID at console.cloud.google.com
   (APIs & Services > Credentials), add your site URL as an authorized JS origin,
   and paste the client ID below. Leave empty to use the name-only fallback. */
const GOOGLE_CLIENT_ID='';

/* ======= helpers ======= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const norm=s=>String(s).toLowerCase().replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();
const shuffle=a=>[...a].sort(()=>Math.random()-.5);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2600)}

/* ======= state ======= */
const KEY='winston.v1';
const DEMO={id:'demo',name:'Intro to Business (demo)',careerNotes:{},sessions:[],items:[
 ['Opportunity cost','The value of the next-best alternative you give up when you make a choice. Every choice has one.'],
 ['Revenue','The total money a business earns from selling goods or services. It is counted before any expenses are subtracted.'],
 ['Profit','Revenue minus all expenses. If it is negative, the business has a loss.'],
 ['Stakeholder','Any person or group affected by a company\'s actions. Examples are customers, employees, and investors.'],
 ['Market segmentation','Dividing a market into groups of customers with similar needs. It lets a company aim its message at the right people.'],
 ['Supply and demand','Prices rise when demand is higher than supply. Prices fall when supply is higher than demand.']
].map(([term,text])=>({id:uid(),term,text}))};
ensure(DEMO);let S=load();let joy=0;
function ensure(c){c.weeks=c.weeks||[];c.docs=c.docs||[];c.events=c.events||[];c.meet=c.meet||{days:[],start:'',end:''};c.goalMin=c.goalMin||180;c.items.forEach(i=>{if(!i.wk)i.wk='course'})}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.v===1){s.classes.forEach(ensure);return s}}catch(e){}
 return {v:1,user:null,coins:0,earned:0,happy:70,tick:Date.now(),owned:[],eq:{},classes:[DEMO],friends:[],checks:0}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Storage is full — remove some uploaded files')}}
// Winston gets a little lonelier while you are away (gentle: never below 15).
(function decay(){const h=(Date.now()-S.tick)/36e5;S.happy=Math.max(15,Math.min(S.happy,100)-h*1.5);S.tick=Date.now();save()})();

const lvl=()=>Math.floor(Math.sqrt(S.earned/15))+1;
function earn(n,why){const before=lvl();S.coins+=n;S.earned+=n;S.happy=Math.min(100,S.happy+n*1.5);save();
 toast(`+${n} 🪙 ${why}`);if(lvl()>before)setTimeout(()=>{toast(`🎉 Level ${lvl()}! Winston is so proud!`);burst(44)},2700);refresh();joy=Date.now();setTimeout(()=>burst(8+Math.min(n,8)),80)}
const mood=()=>S.happy>=65?'happy':S.happy>=35?'ok':'sad';

/* ======= Winston the Pomeranian (SVG) ======= */
const STAR='M0-6 L1.8-1.8 L6 0 L1.8 1.8 L0 6 L-1.8 1.8 L-6 0 L-1.8-1.8Z';
const ACC={

// smooth, symmetric fluffy outline: one closed curve (no separate puffs)
function fluff(cx,cy,rx,ry,n,tuft,cheek,tension){
 const R=[];for(let k=0;k<=n;k++){const a=-Math.PI/2+k/n*Math.PI,odd=k%2===1,f=(odd?1+tuft:1-tuft*.45)*(1+(cheek||0)*Math.pow(Math.sin(Math.PI*k/n),2));R.push([cx+rx*f*Math.cos(a),cy+ry*f*Math.sin(a)])}
 const P=[...R,...R.slice(1,-1).reverse().map(([x,y])=>[2*cx-x,y])],N=P.length,t=(tension||1)/6;let d=`M${P[0][0].toFixed(1)} ${P[0][1].toFixed(1)}`;
 for(let i=0;i<N;i++){const a=P[(i-1+N)%N],b=P[i],c=P[(i+1)%N],e=P[(i+2)%N];d+=`C${(b[0]+(c[0]-a[0])*t).toFixed(1)} ${(b[1]+(c[1]-a[1])*t).toFixed(1)} ${(c[0]-(e[0]-b[0])*t).toFixed(1)} ${(c[1]-(e[1]-b[1])*t).toFixed(1)} ${c[0].toFixed(1)} ${c[1].toFixed(1)}`}
 return d+'Z'}

async function readDoc(f){const ext=(f.name.split('.').pop()||'').toLowerCase();
 if(['txt','md','csv','text'].includes(ext))return await f.text();

 if(ext==='docx'){await loadScript(CDN+'mammoth/1.6.0/mammoth.browser.min.js');return (await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()})).value}
 if(ext==='pptx'){await loadScript(CDN+'jszip/3.10.1/jszip.min.js');const z=await JSZip.loadAsync(await f.arrayBuffer());

  for(const n of names){const x=await z.files[n].async('string');out.push('Slide '+n.match(/\d+/)[0]+': '+[...x.matchAll(/<a:t>([^<]*)<\/a:t>/g)].map(m=>m[1]).join(' ').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'"))}return out.join('\n')}
 throw new Error('Unsupported file type .'+ext+' (try PDF, DOCX, PPTX or TXT)')}
function heuristic(text){const out=[],seen=new Set();
 const add=(t,x)=>{t=t.replace(/^[•\-–*\d.)\s]+/,'').replace(/^(?:an?|the)\s+/i,'').trim();t=t.charAt(0).toUpperCase()+t.slice(1);x=x.trim();if(t.length<2||t.length>60||t.split(/\s+/).length>6||x.length<15)return;const k=t.toLowerCase();if(seen.has(k))return;seen.add(k);out.push({term:t,text:x.slice(0,300)})};
 for(const l of text.split(/\n+/)){const m=l.match(/^[\s•\-–*\d.)]*([^:–—]{2,60}?)\s*(?:::|:|—|–|-)\s+(.{15,})$/);if(m)add(m[1],m[2])}
 for(const sn of text.replace(/\s+/g,' ').split(/(?<=[.!?])\s+/)){const m=sn.match(/^(?:An?|The)?\s*([A-Z][A-Za-z'’ -]{2,50}?)\s+(?:is|are|refers to|means|describes)\s+(.{15,})/);if(m)add(m[1],sn)}
 return out.slice(0,40)}
async function makeCards(c,doc){let cards=[];
 if(AI.sm){try{for(let k=0;k<2&&k*12000<doc.text.length;k++){const chunk=doc.text.slice(k*12000,(k+1)*12000);
   const r=await AI.sm.json(`You are helping a student study. From the course material below (file "${doc.name}", ${wkLabel(c,doc.wk)}), create study cards for the key terms and concepts a student should learn. Each card has "term" (a short name, 1-6 words) and "text" (a clear 1-2 sentence explanation in plain words, based on the material). Skip fluff, page numbers and boilerplate. Return ONLY JSON: {"cards":[{"term":"...","text":"..."}]} with at most 20 cards.\n\nMATERIAL:\n${chunk}`);
   cards.push(...(r.cards||[]))}}catch(e){if(e&&e.code==='not_granted')AI.sm=null}}
 if(!cards.length)cards=heuristic(doc.text);
 const have=new Set(c.items.map(i=>i.term.toLowerCase()));let n=0;
 for(const x of cards){if(!x||!x.term||!x.text)continue;const k=String(x.term).toLowerCase();if(have.has(k))continue;have.add(k);c.items.push({id:uid(),term:String(x.term).slice(0,60),text:String(x.text).slice(0,300),wk:doc.wk,src:doc.id});n++}
 doc.cards=(doc.cards||0)+n;save();return n}

   const isSyl=!!syl||/syllab/i.test(f.name);
   const doc={id:uid(),name:f.name,wk,kind:isSyl?'syllabus':'material',text:text.slice(0,40000),chars:text.length,cards:0};c.docs.push(doc);save();
   stat(`Making study cards from ${f.name}…`);const n=await makeCards(c,doc);msg+=`✅ ${f.name}: ${n} study cards added. `;
   if(isSyl){stat(`Looking for dates in ${f.name}…`);const k=await findDates(c,[doc]);msg+=k?`📅 ${k} dates added to your calendar. `:''}}

const PERSONA="You are Winston, a warm, playful Pomeranian study buddy and tutor. Help stressed students feel capable. Rules: plain friendly words, short sentences; break explanations into numbered steps (1., 2., 3.) with ONE idea per step; use a tiny everyday example when it helps; at most one emoji; no markdown headings; never talk down. Prefer the student's class materials and what the teacher said; if you go beyond them, start that part with 'Beyond your notes:'. Keep chat answers under 170 words.";
const chat={};
function ctxOf(c){const u=S.user;return `CLASS: ${c.name}\nSTUDENT: major ${u.majors||'unknown'}; career goals: ${u.careers.join(', ')}\nCLASS MATERIALS:\n${c.items.slice(0,40).map(i=>`- ${i.term}: ${i.text}`).join('\n')||'(none yet)'}\nUPLOADED COURSE DOCUMENTS (excerpts):\n${docsCtx(c)}\nWHAT THE TEACHER SAID RECENTLY:\n${c.sessions.flatMap(x=>x.lines).slice(-20).map(l=>'- '+l).join('\n')||'(nothing recorded)'}`}
function md(t){const b=x=>x.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');return esc(t).split(/\n+/).filter(l=>l.trim()).map(l=>{const m=l.match(/^\s*(\d+)[.)]\s+(.*)/);return m?`<div class="step"><div class="n">${m[1]}</div><div>${b(m[2])}</div></div>`:`<p style="margin:6px 0">${b(l)}</p>`}).join('')}
function chatHTML(id){return (chat[id]||[]).map(m=>m.role==='user'?`<div class="bubble" style="margin-left:28px;background:rgba(141,124,255,.22)">${esc(m.content)}</div>`:`<div class="bubble">🐶 ${m.pending&&!m.content?'<span class="mute">thinking…</span>':md(m.content)}</div>`).join('')}
function paintChat(c){const el=$('#chat');if(el){el.innerHTML=chatHTML(c.id);el.lastElementChild&&el.lastElementChild.scrollIntoView({block:'nearest'})}}
function localAnswer(c,q){const n=norm(q),qw=n.split(' ').filter(w=>w.length>2&&!STOP.has(w));
 const pool=[...c.items.map(i=>({t:i.term,s:i.text})),...c.sessions.flatMap(x=>x.lines.map(l=>({t:'Teacher said',s:l})))];
 const sc=pool.map(p=>({p,n:qw.filter(w=>norm(p.t+' '+p.s).includes(w.slice(0,5))).length})).filter(x=>x.n>0).sort((a,b)=>b.n-a.n).slice(0,3);
 return sc.length?`Woof! Here's how I'd explain it, step by step:\n`+sc.map((x,i)=>`${i+1}. **${x.p.t}:** ${x.p.s}`).join('\n'):`Hmm, I couldn't find that in this class's materials or what your teacher said. Add it to Materials and I'll learn it too! 🐾`}
const curSes=c=>{const i=view.ses!=null&&c.sessions[view.ses]?view.ses:c.sessions.length-1;return c.sessions[i]};
function rRecap(c){
 const ses=curSes(c);
 const items=ses?ses.hits.map(h=>({it:c.items.find(i=>i.id===h.id),line:h.line})).filter(x=>x.it):c.items.map(it=>({it}));
 let n=0;
 const local=`${items.map(({it,line})=>`<div class="step"><div class="n">${++n}</div><div><b>${esc(it.term)}</b>${line?`<div class="mute">Teacher: “${esc(line)}”</div>`:''}<ol style="margin:6px 0 0;padding-left:18px">${sentences(it.text).map(s=>`<li>${esc(s)}</li>`).join('')}</ol></div></div>`).join('')||'<p class="mute">Nothing was matched in that class — add the materials, then use the “Teacher said” box next time.</p>'}`;
 let body;
 if(ses&&ses.ai){const r=ses.ai;body=`<div class="bubble">🐶 ${esc(r.big||'')}</div>`+(r.steps||[]).map((st,i)=>`<div class="step"><div class="n">${i+1}</div><div><b>${esc(st.title)}</b><div>${esc(st.body)}</div>${st.example?`<div class="mute">For example: ${esc(st.example)}</div>`:''}</div></div>`).join('')+(r.career?`<div class="bubble">🚀 ${esc(r.career)}</div>`:'')+((r.check||[]).length?`<h3 style="margin-top:12px">Quick self-check</h3><ul style="margin:6px 0;padding-left:18px">${r.check.map(q=>`<li>${esc(q)}</li>`).join('')}</ul>`:'')+`<details style="margin-top:10px"><summary class="mute">What Winston heard in class</summary>${local}</details>`}
 else if(ses&&ses.aiState==='loading')body=`<p class="bubble">🐾 Winston is writing your step-by-step recap…</p>`+local;
 else body=local+(ses&&ses.aiState==='error'?`<p class="mute">Winston couldn't write the AI recap this time.</p>`:'');
 const picker=c.sessions.length>1?`<div style="margin-bottom:8px">${c.sessions.map((x,i)=>`<span class="chip ${x===ses?'on':''}" data-a="pickses" data-k="${i}">${esc(x.date)}</span>`).join('')}</div>`:'';
 $('#sub').innerHTML=`<div class="card"><h2>${ses?'Recap · '+esc(ses.date):'Primer from your materials'}</h2>${picker}
 <p class="mute">${ses?'Here\'s what happened, one small step at a time. You only need to understand one step at a time. 💛':'No live class recorded yet, so here\'s a gentle walkthrough of your materials.'}</p>${body}
 <div class="row" style="margin-top:10px"><button class="p purple" data-a="pc" data-k="${c.id}">✏️ Practice this class</button>${AI.sm&&ses&&ses.aiState!=='loading'?`<button class="s" data-a="genrecap">✨ ${ses.ai?'Rewrite with Winston':'Explain it step by step with Winston'}</button>`:''}</div></div>
 <div class="card"><h3>🐶 Ask Winston anything about this class</h3>
 <div id="chat">${chatHTML(c.id)}</div>
 <div class="row" style="margin:6px 0">${['Explain the big idea simply','Quiz me gently','Why does this matter for my career?'].map(q=>`<span class="chip" data-a="ask" data-q="${esc(q)}">${esc(q)}</span>`).join('')}</div>
 <div class="row"><input class="grow" id="ask" placeholder="e.g. what's the difference between revenue and profit?"><button class="p" data-a="ask">Ask</button></div>
 ${AI.sm?'':'<p class="mute">Smart AI answers switch on in the published Claude page. Here, Winston searches your notes instead.</p>'}</div>`;
}
async function genRecap(c,ses){
 if(!AI.sm)return;ses.aiState='loading';const here=()=>tab==='class'&&view.cls===c.id&&view.sub==='recap';if(here())render();
 const cov=ses.hits.map(h=>c.items.find(i=>i.id===h.id)).filter(Boolean),use=cov.length?cov:c.items;
 const prompt=`${persona()}\n\nTASK: Write a calm, step-by-step recap of today's class so the student feels they understand it and is not overwhelmed. Use ONLY the information below. Teach in the order it was covered.\n\n${ctxOf(c)}\n\nTOPICS COVERED TODAY, IN ORDER:\n${use.map((i,k)=>`${k+1}. ${i.term}: ${i.text}`).join('\n')}\nTEACHER'S WORDS TODAY:\n${ses.lines.slice(-30).map(l=>'- '+l).join('\n')||'(not recorded)'}\n\nReturn ONLY JSON in exactly this shape: {"big":"one reassuring sentence about the big picture","steps":[{"title":"short title","body":"2-3 simple sentences","example":"one tiny everyday example"}],"career":"one sentence linking today to the student's career goals","check":["two quick self-check questions"]}. At most 7 steps.`;
 try{const r=await AI.sm.json(prompt);if(!r||!Array.isArray(r.steps)||!r.steps.length)throw 0;ses.ai=r;ses.aiState='done'}catch(e){ses.aiState='error';if(e&&e.code==='not_granted')AI.sm=null}
 save();if(here())render()}
Object.assign(ACTIONS,{pc(d){tab='practice';startPractice(d.k,d.w)},
 pickses(d){view.ses=+d.k;render()},
 genrecap(){const c=cur();genRecap(c,curSes(c))},
 async ask(d){const c=cur(),inp=$('#ask'),q=(d.q||(inp&&inp.value)||'').trim();if(!q)return;if(inp)inp.value='';
  const h=chat[c.id]=chat[c.id]||[];
  if(!AI.sm){h.push({role:'user',content:q},{role:'assistant',content:localAnswer(c,q)});return paintChat(c)}
  const turns=h.slice(-8).map(t=>({role:t.role,content:t.content})).concat({role:'user',content:q});
  const msgs=turns.map((t,i)=>i===0?{role:'user',content:`${persona()}\n\n${ctxOf(c)}\n\nStudent question: ${t.content}`}:t);
  h.push({role:'user',content:q});const reply={role:'assistant',content:'',pending:true};h.push(reply);paintChat(c);
  try{const r=await AI.sm(msgs,{cache:false,onText:({text})=>{reply.content=text;paintChat(c)}});reply.content=(r&&r.text)||reply.content}
  catch(e){if(e&&e.code==='not_granted'){AI.sm=null;reply.content=localAnswer(c,q)}else reply.content=e&&e.code==='rate_limited'?'I need a quick breather — ask me again in a moment! 🐾':'Woof, I got tangled up. Try again? 🐾'}
  reply.pending=false;paintChat(c)}});

function rPractice(){
 if(!P){$('#main').innerHTML=`<div class="card"><h2>Practice with Winston</h2><p class="mute">Correct answers earn 5 🪙. Miss one? Walk through my step-by-step explanation and you'll still earn 3 🪙.</p>
 <button class="p purple" data-a="pall" style="width:100%;margin-bottom:8px">All classes mixed</button>
 ${classes().map(c=>`<button class="s" style="width:100%;margin:4px 0" data-a="pc" data-k="${c.id}">${esc(c.name)}</button><div style="margin:0 0 10px">${c.weeks.filter(w=>c.items.some(i=>i.wk===w.id)).map(w=>`<span class="chip" data-a="pc" data-k="${c.id}" data-w="${w.id}">Week ${w.n}</span>`).join('')}</div>`).join('')}</div>`;return}
 if(P.done){$('#main').innerHTML=`<div class="card dogwrap"><div class="dogwrap">${dog(S.eq,'happy')}</div><h2>Round complete! 🎉</h2><p>${P.right} first-try correct · ${P.walked} learned with my help.<br>You earned <b>${P.coins} 🪙</b>.</p><button class="p" data-a="again">Another round</button> <button class="s" data-a="tab" data-k="home">Home</button></div>`;return}
 const q=P.qs[P.i];let body='';
 if(P.phase==='ask'){
  body=`<span class="chip on">${{mc:'Multiple choice',fill:'Fill in the blank',open:'Open answer'}[q.type]}</span><h3 style="margin-top:8px">${esc(q.prompt)}</h3>`+
   (q.type==='mc'?q.choices.map((ch,i)=>`<button class="opt" data-a="mcpick" data-k="${i}">${esc(ch)}</button>`).join('')
   :(q.type==='open'?'<textarea id="ans" placeholder="Type your answer"></textarea>':'<input id="ans" placeholder="Type your answer">')+`<button class="p" data-a="submit">Check</button>`)}
 if(P.phase==='walk'){const st=q.steps;
  body=`<p class="bubble">Not quite — and that's totally fine! Let's walk through it together. 🐾</p><h3>Step ${P.step+1} of ${st.length}</h3><div class="step"><div class="n">${P.step+1}</div><div>${esc(st[P.step])}</div></div><button class="p" data-a="nextstep">${P.step+1<st.length?'Got it, next step':'Got it — try again'}</button>`}
 if(P.phase==='retry'){body=`<p class="bubble">Now that we've walked through it: ${esc(q.retry)}</p><input id="ans" placeholder="Type your answer">${P.hint?`<p class="mute">Hint: starts with “${esc(q.answer[0])}”</p>`:''}<button class="p" data-a="retrysub">Check</button>`}
 if(P.phase==='fb'){body=`<p class="bubble">${P.msg}</p><button class="p" data-a="nextq">${P.i+1<P.qs.length?'Next question':'Finish'}</button>`}
 $('#main').innerHTML=`<div class="row" style="margin-bottom:6px"><span class="mute grow">Question ${P.i+1} of ${P.qs.length}</span><span class="stat">🪙 ${S.coins}</span></div><div class="card">${body}</div>`;
 const a=$('#ans');if(a)a.focus();
}
function startPractice(clsId,wk,cnt){
 const pool=clsId==='all'?allItems():allItems().filter(i=>i.cls===clsId&&(!wk||wk==='all'||i.wk===wk));
 if(!pool.length){tab='practice';return toast('Add materials to a class first!')}
 const every=allItems().map(i=>i.text);
 const qs=shuffle(pool).slice(0,cnt||8).map((it,idx)=>{
  let type=['mc','fill','open'][idx%3];
  const others=shuffle(every.filter(t=>t!==it.text)).slice(0,3);
  if(type==='mc'&&others.length<3)type='fill';
  const short=t=>t.length>120?t.slice(0,117)+'…':t;
  const steps=sentences(it.text);if(steps.length<2)steps.push(`The key term here is “${it.term}”.`);
  const q={item:it,type,steps,answer:it.term,retry:`what is this describing? “${it.text}”`};
  if(type==='mc'){q.prompt=`Which best describes “${it.term}”?`;q.choices=shuffle([it.text,...others]).map(short);q.right=short(it.text)}
  if(type==='fill'){const re=new RegExp(it.term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig');const t=it.text.replace(re,'_____');
   q.prompt=t.includes('_____')?t:`_____ : ${it.text}`}
  if(type==='open'){q.prompt=`In your own words, what is “${it.term}”?`}
  return q});
 P={qs,i:0,phase:'ask',step:0,right:0,walked:0,coins:0,scope:clsId,wk,t0:Date.now()};render()}
function okFill(a,b){a=norm(a);b=norm(b);if(!a)return false;if(a===b)return true;return a.length>5&&lev(a,b)<=1}
function lev(a,b){const d=[...Array(a.length+1)].map((_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;
 for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
function okOpen(ans,q){const a=norm(ans);if(a.length<3)return false;
 const kw=[...new Set(norm(q.item.text).split(' ').filter(w=>w.length>4&&!STOP.has(w)))];if(!kw.length)return okFill(ans,q.answer);
 const hit=kw.filter(w=>a.includes(w.slice(0,5))).length;return hit>=Math.max(1,Math.ceil(kw.length*.3))}
function grade(ok){const q=P.qs[P.i];
 if(ok){P.right++;P.coins+=5;earn(5,'correct!');P.phase='fb';P.msg='✅ Yes! '+(q.type==='open'?`Model answer: ${esc(q.item.text)}`:'Nice one.')}
 else{P.phase='walk';P.step=0}render()}
Object.assign(ACTIONS,{
 pall(){startPractice('all')},again(){startPractice(P.scope,P.wk)},
 mcpick(d){const q=P.qs[P.i];grade(q.choices[+d.k]===q.right)},
 submit(){const q=P.qs[P.i],v=$('#ans').value;if(!v.trim())return;grade(q.type==='fill'?okFill(v,q.answer):okOpen(v,q))},
 nextstep(){const q=P.qs[P.i];if(P.step+1<q.steps.length)P.step++;else{P.phase='retry';P.hint=false}render()},
 retrysub(){const q=P.qs[P.i];if(okFill($('#ans').value,q.answer)){P.walked++;P.coins+=3;earn(3,'you worked it out!');P.phase='fb';P.msg=`✅ That's it — <b>${esc(q.answer)}</b>! You figured it out with me. I'm proud of you. 🐶`}else{P.hint=true;toast('Almost — check the hint!')}render()},
 nextq(){if(P.i+1<P.qs.length){P.i++;P.phase='ask'}else{P.done=true;if(P.scope&&P.scope!=='all'&&!(S.timer&&S.timer.cls===P.scope))addLog(P.scope,(Date.now()-P.t0)/1000,'practice',P.t0)}render()}
});

const pad2=n=>String(n).padStart(2,'0');
const isoD=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const todayIso=()=>isoD(new Date());
const fromIso=x=>{const [y,m,d]=x.split('-').map(Number);return new Date(y,m-1,d)};
const weekStart=()=>{const x=new Date();x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const fmtDur=x=>{x=Math.round(x);const h=Math.floor(x/3600),m=Math.floor(x%3600/60);return h?`${h}h ${m}m`:`${m}m`};
const fmtClock=x=>{x=Math.floor(x);return pad2(Math.floor(x/60))+':'+pad2(x%60)};
const DAYN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const EVT={class:['Class','#4cc455'],assignment:['Assignment','#ff9a3d'],exam:['Exam','#e0504d'],reading:['Reading','#6aa8ff'],other:['Other','#a58bff']};

const _fixed=new WeakSet();
function fixNode(n){if(DN()==='Winston')return;
 if(n.nodeType===3){if(!_fixed.has(n)){if(n.nodeValue.includes('Winston'))n.nodeValue=n.nodeValue.replace(/Winston(?!​)/g,DN());_fixed.add(n)}return}
 if(n.nodeType===1&&!/^(SCRIPT|STYLE|TEXTAREA|INPUT)$/.test(n.tagName)){const w=document.createTreeWalker(n,NodeFilter.SHOW_TEXT),a=[];let t;while(t=w.nextNode())a.push(t);a.forEach(fixNode)}}
new MutationObserver(ms=>{for(const m of ms){if(m.type==='characterData')fixNode(m.target);else m.addedNodes.forEach(fixNode)}}).observe(document.body,{childList:true,subtree:true,characterData:true});

let G=null;
const shortT=t=>{const x=sentences(t)[0];return x.length>44?x.slice(0,41)+'…':x};
function openGame(){const pool=shuffle(allItems()).slice(0,6),pairs=pool.map((i,k)=>({k,a:i.term,b:shortT(i.text)})),fun=[['🦴','Bone'],['🐾','Paw'],['🎾','Ball'],['🌼','Flower'],['⭐','Star'],['🏠','Doghouse']];
 for(let i=0;pairs.length<6;i++)pairs.push({k:100+i,a:fun[i][0],b:fun[i][1]});
 const cards=shuffle(pairs.flatMap(p=>[{pair:p.k,text:p.a},{pair:p.k,text:p.b}])).map((c,i)=>({...c,id:i,open:false,done:false}));
 G={cards,first:null,lock:false,moves:0,found:0,pairs:pairs.length,study:pool.length>=3,t0:Date.now(),won:false};
 openModal(`<h2>🎮 Memory Match</h2><p class="mute" id="gmsg"></p><div id="ggrid" class="gamegrid"></div><div class="row" style="margin-top:10px"><span class="stat" id="gstat"></span><button class="s" data-a="gagain">New game</button></div>`);paintGame()}
function paintGame(){const gr=$('#ggrid');if(!gr||!G)return;
 gr.innerHTML=G.cards.map(c=>`<div class="gcard ${c.open?'open':''} ${c.done?'done':''}" data-a="gflip" data-k="${c.id}">${c.open||c.done?esc(c.text):'🐾'}</div>`).join('');
 $('#gstat').textContent=`Moves: ${G.moves} · Pairs: ${G.found}/${G.pairs}`;
 $('#gmsg').textContent=G.won?'':G.study?'Match each term with its meaning.':'Add study cards to turn this into a study game! For now, match the pairs.'}
function gflip(k){const c=G&&G.cards[k];if(!c||G.lock||c.open||c.done)return;c.open=true;
 if(G.first==null){G.first=k}else{G.moves++;const f=G.cards[G.first];G.first=null;
  if(f.pair===c.pair){f.open=c.open=false;f.done=c.done=true;G.found++;if(G.found===G.pairs){G.won=true;const r=dayRec();r.games=(r.games||0)+1;
    const msg=r.games<=3?(earn(3,'for winning the game! 🎉'),'You earned 3 coins!'):'(Coins are capped at 3 wins a day — but great job!)';
    setTimeout(()=>{$('#gmsg').innerHTML=`🎉 You won in ${G.moves} moves! ${msg}`},50)}}
  else{G.lock=true;setTimeout(()=>{f.open=c.open=false;G.lock=false;paintGame()},850)}}
 paintGame()}

 if(c.meet.days.includes(d.getDay()))out.push({id:'m'+iso,title:'Class meets',type:'class',date:iso,time:c.meet.start,rec:true});
 return out.sort((a,b)=>(a.time||'').localeCompare(b.time||''))}

 return out.sort((a,b)=>a.d-b.d||(a.time||'').localeCompare(b.time||'')).slice(0,limit)}

const MON={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
const guessType=t=>{t=t.toLowerCase();return /exam|midterm|final|quiz|test/.test(t)?'exam':/due|assign|homework|\bhw\b|paper|project|essay|submit|case/.test(t)?'assignment':/read|chapter|\bch\./.test(t)?'reading':'other'};
function parseDates(text){const out=[],now=new Date(),flat=text.replace(/[ \t]+/g,' ');
 const push=(m,d,y,idx,len)=>{if(m<0||m>11||d<1||d>31)return;let yr=y?(y<100?2000+y:y):now.getFullYear(),dt=new Date(yr,m,d);if(!y&&dt<new Date(now.getTime()-60*864e5))dt=new Date(yr+1,m,d);
  const before=flat.slice(Math.max(0,idx-50),idx).split(/[.\n;]/).pop().trim(),after=flat.slice(idx+len,idx+len+70).split(/[.\n;]/)[0].trim();
  const title=(before+' '+after).replace(/^[\s\-–—:•*|,()]+|[\s\-–—:•*|,()]+$/g,'').replace(/\s+/g,' ').slice(0,80)||'Syllabus item';out.push({title,date:isoD(dt),type:guessType(before+' '+after)})};
 let m,re=/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+(\d{1,2})(?:st|nd|rd|th)?(?:,?\s*(\d{4}))?/ig;
 while((m=re.exec(flat)))push(MON[m[1].toLowerCase()],+m[2],m[3]?+m[3]:0,m.index,m[0].length);
 re=/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/g;while((m=re.exec(flat)))push(+m[1]-1,+m[2],m[3]?+m[3]:0,m.index,m[0].length);
 return out.slice(0,80)}
async function findDates(c,docs){let found=[];
 if(AI.sm){try{const text=docs.map(d=>d.text).join('\n\n').slice(0,14000),r=await AI.sm.json(`Today is ${todayIso()}. From this course syllabus text, extract dated events a student must track: exams, quizzes, assignments due, project deadlines, important readings. Do NOT list ordinary class meetings. Infer the year from today's date (courses run in the near future). Return ONLY JSON: {"events":[{"title":"short title","date":"YYYY-MM-DD","type":"exam|assignment|reading|other"}]} with at most 60 events.\n\nSYLLABUS:\n${text}`);
   found=(r.events||[]).filter(e=>e&&/^\d{4}-\d{2}-\d{2}$/.test(e.date)&&e.title).map(e=>({title:String(e.title).slice(0,80),date:e.date,type:EVT[e.type]?e.type:'other'}))}catch(e){if(e&&e.code==='not_granted')AI.sm=null}}
 if(!found.length)found=docs.flatMap(d=>parseDates(d.text));
 const have=new Set(c.events.map(e=>e.title.toLowerCase()+e.date));let n=0;
 for(const e of found){const k=e.title.toLowerCase()+e.date;if(have.has(k))continue;have.add(k);c.events.push({id:uid(),...e});n++}save();return n}

const s2=a=>(Array.isArray(a)?a:[]).map(x=>String(x)).filter(Boolean).slice(0,40);
function normNotes(n,c){if(!n||typeof n!=='object')return null;const secs=(Array.isArray(n.sections)?n.sections:[]).map(x=>({heading:String(x&&x.heading||'Notes'),bullets:s2(x&&x.bullets)})).filter(x=>x.bullets.length);
 const terms=(Array.isArray(n.terms)?n.terms:[]).filter(t=>t&&t.term).map(t=>({term:String(t.term),def:String(t.def||'')})).slice(0,40);
 if(!secs.length&&!terms.length)return null;return {title:String(n.title||c.name+' — class notes').slice(0,120),summary:s2(n.summary),sections:secs,terms,todo:s2(n.todo),questions:s2(n.questions)}}
function notesFallback(c,ses){const cov=ses.hits.map(h=>({it:c.items.find(i=>i.id===h.id),line:h.line})).filter(x=>x.it),other=ses.lines.filter(l=>!ses.hits.some(h=>h.line===l));
 return {title:`${c.name} — class notes`,summary:[cov.length?`Today covered ${cov.length} topic${cov.length>1?'s':''}: ${cov.map(x=>x.it.term).join(', ')}.`:'No topics from your materials were matched today.'],
  sections:[...cov.map(x=>({heading:x.it.term,bullets:[...sentences(x.it.text),`Teacher said: “${x.line}”`]})),...(other.length?[{heading:'Other things the teacher said',bullets:other.slice(0,30)}]:[])],terms:cov.map(x=>({term:x.it.term,def:x.it.text})),todo:[],questions:[]}}
const notesText=(c,ses,n)=>{const L=[`# ${n.title}`,`${c.name} · ${ses.date}`,''];if(n.summary.length)L.push('## Summary',...n.summary.map(x=>'- '+x),'');for(const x of n.sections)L.push('## '+x.heading,...x.bullets.map(b=>'- '+b),'');
 if(n.terms.length)L.push('## Key terms',...n.terms.map(t=>`- ${t.term}: ${t.def}`),'');if(n.todo.length)L.push('## To do / dates',...n.todo.map(x=>'- '+x),'');if(n.questions.length)L.push('## Questions to review',...n.questions.map(x=>'- '+x),'');return L.join('\n')};
const notesHtml=(c,ses,n)=>{const li=a=>`<ul>${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;let h=`<h1>${esc(n.title)}</h1><p><i>${esc(c.name)} · ${esc(ses.date)}</i></p>`;
 if(n.summary.length)h+='<h2>Summary</h2>'+li(n.summary);for(const x of n.sections)h+=`<h2>${esc(x.heading)}</h2>`+li(x.bullets);
 if(n.terms.length)h+='<h2>Key terms</h2><ul>'+n.terms.map(t=>`<li><b>${esc(t.term)}</b>: ${esc(t.def)}</li>`).join('')+'</ul>';
 if(n.todo.length)h+='<h2>To do / dates</h2>'+li(n.todo);if(n.questions.length)h+='<h2>Questions to review</h2>'+li(n.questions);return h};
async function makeNotes(c,ses){let n=null;
 if(AI.sm&&ses.lines.length){try{n=normNotes(await AI.sm.json(`${persona()}\n\nTASK: Turn what the teacher said in class into clear, well-organized study notes. Group related points under short headings. Use the class materials for correct terms and spelling. Return ONLY JSON: {"title":"short title","summary":["1-3 bullets"],"sections":[{"heading":"...","bullets":["..."]}],"terms":[{"term":"...","def":"..."}],"todo":["assignments or dates mentioned"],"questions":["2-3 good review questions"]}\n\n${ctxOf(c)}\n\nTEACHER SAID TODAY (in order):\n${ses.lines.slice(-120).map(l=>'- '+l).join('\n')}`),c)}catch(e){if(e&&e.code==='not_granted')AI.sm=null}}
 if(!n)n=normNotes(notesFallback(c,ses),c)||{title:`${c.name} — class notes`,summary:['Nothing was recorded in this class.'],sections:[],terms:[],todo:[],questions:[]};
 ses.notes={data:n,text:notesText(c,ses,n),html:notesHtml(c,ses,n),status:'',link:'',err:''};save();
 if(tab==='class'&&view.cls===c.id&&view.sub==='notes')render();
 if(S.pref.autoDocs&&AI.mcp)driveSave(c,ses)}
const GD='Google Drive';
function idOf(p){const seen=new Set(),f=o=>{if(!o||typeof o!=='object'||seen.has(o))return null;seen.add(o);if(typeof o.id==='string'&&o.id)return o.id;if(typeof o.fileId==='string'&&o.fileId)return o.fileId;for(const v of Object.values(o)){const r=f(v);if(r)return r}return null};
 if(typeof p==='string'){try{return f(JSON.parse(p))}catch(e){return null}}return f(p)}
function urlOf(p){const seen=new Set(),f=o=>{if(!o||typeof o!=='object'||seen.has(o))return null;seen.add(o);for(const v of Object.values(o)){if(typeof v==='string'&&/^https:\/\/(docs|drive)\.google\.com\//.test(v))return v;const r=f(v);if(r)return r}return null};return f(p)}
const qs=x=>String(x).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
async function gFolder(mcp,name,parent){
 try{const r=await mcp.callTool(GD,'search_files',{query:`title = '${qs(name)}' and mimeType = 'application/vnd.google-apps.folder' and trashed = false and parentId = '${parent||'root'}'`,pageSize:5,excludeContentSnippets:true});const id=idOf(r.payload);if(id)return id}catch(e){if(e&&e.code&&e.code!=='tool_error')throw e}
 const base={title:name,...(parent?{parentId:parent}:{})};let r;
 try{r=await mcp.callTool(GD,'create_file',{...base,contentMimeType:'application/vnd.google-apps.folder'})}catch(e){if(e&&e.code==='tool_error')r=await mcp.callTool(GD,'create_file',{...base,mimeType:'application/vnd.google-apps.folder'});else throw e}
 const id=idOf(r.payload);if(!id)throw {code:'tool_error',message:'Drive did not return a folder id'};return id}
function driveErr(e){const c=e&&e.code;
 if(c==='needs_reauth'||c==='server_not_connected'||c==='selection_required')return 'Connect Google Drive in claude.ai Settings → Connectors, then try again.';
 if(c==='approval_required'||c==='not_in_manifest'||c==='consent_required')return 'Google Drive needs your OK for this page — tap Save again and allow it when asked.';
 if(c==='blocked_by_policy')return 'Your organization blocks Google Drive for this page.';
 if(c==='server_unavailable'||c==='upstream_error')return 'Google Drive didn\'t answer. Tap Save again to retry.';
 return 'Couldn\'t save to Google Drive'+(e&&e.message?': '+String(e.message).slice(0,120):'.')}
async function driveSave(c,ses){const mcp=AI.mcp,nt=ses&&ses.notes;if(!mcp||!nt)return;nt.status='saving';nt.err='';save();if(view.sub==='notes'&&tab==='class')render();
 const attempt=async fresh=>{if(fresh)S.drive={root:null,classes:{}};
  const root=S.drive.root||(S.drive.root=await gFolder(mcp,'Winston Notes')),cf=S.drive.classes[c.id]||(S.drive.classes[c.id]=await gFolder(mcp,c.name,root));
  const r=await mcp.callTool(GD,'create_file',{title:`${ses.date.split(',')[0]} — ${nt.data.title}`.slice(0,150),parentId:cf,contentMimeType:'text/html',textContent:nt.html}),id=idOf(r.payload);
  nt.link=urlOf(r.payload)||(id?`https://docs.google.com/document/d/${id}/edit`:'');nt.status='saved';save()};
 try{try{await attempt(false)}catch(e){if(e&&e.code==='tool_error'&&S.drive.root)await attempt(true);else throw e}}
 catch(e){nt.status='error';nt.err=driveErr(e);save()}
 if(tab==='class'&&view.cls===c.id&&view.sub==='notes')render();else if(nt.status==='saved')toast('📝 Notes saved to Google Docs!')}
async function downloadText(name,text){const fn=name.replace(/[\\/:*?"<>|]/g,'-');
 try{const dl=window.claude&&claude.use?await claude.use('downloads'):null;if(dl){await dl.save({filename:fn,data:new Blob([text],{type:'text/markdown'})});return}}catch(e){if(e&&e.code==='declined')return}

function rNotes(c){const list=[...c.sessions].reverse();
 $('#sub').innerHTML=`<div class="card"><h2>🗒 ${esc(DN())}'s class notes</h2><p class="mute">During live class ${esc(DN())} jots down what your teacher says and organizes it for you. ${AI.mcp?`Notes can be saved to your Google Drive in <b>Winston Notes › ${esc(c.name)}</b>.`:'Saving to Google Docs works on the published Claude page.'}</p>${AI.mcp?`<span class="chip ${S.pref.autoDocs?'on':''}" data-a="toggledocs">${S.pref.autoDocs?'✓ ':''}Auto-save to Google Docs after class</span>`:''}</div>`+

 function size(){D=Math.min(devicePixelRatio||1,1.5);W=cv.width=Math.round(innerWidth*D);H=cv.height=Math.round(innerHeight*D);if(RM)draw(0)}
 addEventListener('resize',size);
 document.addEventListener('pointerdown',e=>{stamps.push({x:e.clientX*D,y:e.clientY*D,a:.8,s:16*D,rot:(rnd()-.5)*.6})},{passive:true});
 const hy=(L,x)=>(L.y+L.a*Math.sin(x/W*TAU*1.2+L.ph)+L.a*.5*Math.sin(x/W*TAU*2.7+L.ph*2))*H;
 function hill(L){g.fillStyle=L.c;g.beginPath();g.moveTo(0,H);for(let x=0;x<=W+20*D;x+=20*D)g.lineTo(x,hy(L,x));g.lineTo(W,H);g.closePath();g.fill()}
 function paw(x,y,s,rot){g.save();g.translate(x,y);g.rotate(rot);g.beginPath();g.ellipse(0,s*.28,s*.58,s*.46,0,0,TAU);g.fill();for(const [dx,dy,r] of[[-.66,-.12,.22],[-.24,-.52,.25],[.24,-.52,.25],[.66,-.12,.22]]){g.beginPath();g.arc(dx*s,dy*s,r*s,0,TAU);g.fill()}g.restore()}
 function bone(x,y,s,rot){g.save();g.translate(x,y);g.rotate(rot);g.beginPath();g.rect(-s*.6,-s*.17,s*1.2,s*.34);for(const sx of[-1,1])for(const sy of[-1,1]){g.moveTo(sx*s*.62+s*.2,sy*s*.2);g.arc(sx*s*.62,sy*s*.2,s*.2,0,TAU)}g.fill();g.stroke();g.restore()}
 function cloud(x,y,s){g.save();g.fillStyle='rgba(255,255,255,.94)';g.shadowColor='rgba(120,170,210,.35)';g.shadowBlur=12*D;for(const [dx,dy,r] of[[0,0,26],[28,6,20],[-28,8,20],[14,-12,22],[-12,-8,18]]){g.beginPath();g.arc(x+dx*s*D,y+dy*s*D,r*s*D,0,TAU);g.fill()}g.restore()}
 function flower(f,t){const x=f.x*W,b=hy(NEAR,x),y=b+(f.r*.85+.04)*(H-b),h=20*D*f.s,sw=Math.sin(t*1.4+f.p)*2.5*D,hx=x+sw,hyy=y-h;
  g.strokeStyle='#3f9a3a';g.lineWidth=2.2*D;g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+sw*.3,y-h*.5,hx,hyy);g.stroke();
  if(f.k==='daisy'){g.fillStyle='#fff';for(let k=0;k<8;k++){g.save();g.translate(hx,hyy);g.rotate(k/8*TAU);g.beginPath();g.ellipse(0,-6*D*f.s,2.6*D*f.s,5.4*D*f.s,0,0,TAU);g.fill();g.restore()}g.fillStyle='#ffd23f';g.beginPath();g.arc(hx,hyy,3.4*D*f.s,0,TAU);g.fill()}
  else{g.fillStyle=f.c;g.beginPath();g.moveTo(hx-6*D*f.s,hyy-8*D*f.s);g.quadraticCurveTo(hx-8*D*f.s,hyy+5*D*f.s,hx,hyy+6*D*f.s);g.quadraticCurveTo(hx+8*D*f.s,hyy+5*D*f.s,hx+6*D*f.s,hyy-8*D*f.s);g.lineTo(hx+2*D*f.s,hyy-3*D*f.s);g.lineTo(hx,hyy-9*D*f.s);g.lineTo(hx-2*D*f.s,hyy-3*D*f.s);g.closePath();g.fill()}}
 function draw(t){
  const sk=g.createLinearGradient(0,0,0,H);sk.addColorStop(0,'#7fd3ff');sk.addColorStop(.55,'#c4ecff');sk.addColorStop(.8,'#fff4d4');g.fillStyle=sk;g.fillRect(0,0,W,H);
  const sx=W*.86,sy=H*.11,sg=g.createRadialGradient(sx,sy,0,sx,sy,H*.3);sg.addColorStop(0,'rgba(255,246,176,.95)');sg.addColorStop(.35,'rgba(255,240,150,.35)');sg.addColorStop(1,'rgba(255,240,150,0)');g.fillStyle=sg;g.fillRect(0,0,W,H);
  g.save();g.translate(sx,sy);g.rotate(t*.1);g.fillStyle='rgba(255,236,130,.55)';for(let k=0;k<14;k++){g.rotate(TAU/14);g.beginPath();g.moveTo(34*D,-5*D);g.lineTo(70*D,0);g.lineTo(34*D,5*D);g.fill()}g.restore();
  g.fillStyle='#ffe14d';g.beginPath();g.arc(sx,sy,28*D,0,TAU);g.fill();g.fillStyle='#fff3a0';g.beginPath();g.arc(sx-6*D,sy-6*D,14*D,0,TAU);g.fill();
  for(const c of clouds)cloud(((c.x%1.4)-.2)*W,c.y*H,c.s);
  hill(FAR);hill(MID);
  g.strokeStyle='#e3b06a';g.lineWidth=5*D;for(let x=.04*W,px=null;x<=.62*W;x+=46*D){const y=hy(MID,x);if(px){g.beginPath();g.moveTo(px[0],px[1]-18*D);g.lineTo(x,y-18*D);g.moveTo(px[0],px[1]-8*D);g.lineTo(x,y-8*D);g.stroke()}px=[x,y]}
  for(let x=.04*W;x<=.62*W;x+=46*D){const y=hy(MID,x);g.fillStyle='#d49a52';g.strokeStyle='#a86a2a';g.lineWidth=2*D;g.beginPath();g.rect(x-4*D,y-28*D,8*D,32*D);g.fill();g.stroke()}
  hill(NEAR);for(const f of flowers)flower(f,t);
  g.lineWidth=1.5*D;for(const b of bits){g.globalAlpha=.34;g.fillStyle=b.k==='paw'?'#ff8fba':'#fff';g.strokeStyle='#e8d3a8';(b.k==='paw'?paw:bone)(b.x*W,b.y*H,b.sz*D,b.rot+Math.sin(t+b.x*9)*.15)}g.globalAlpha=1;
  for(const s of stamps){g.fillStyle=`rgba(255,111,168,${Math.max(0,s.a)})`;paw(s.x,s.y,s.s,s.rot)}}
 function tick(ts){const t=ts/1000,dt=Math.min(.05,t-last);last=t;
  for(const c of clouds)c.x+=c.sp*dt;
  for(const b of bits){b.y-=b.sp*dt;if(b.y<-.05){b.y=1.05;b.x=rnd()}}
  for(const s of stamps){s.a-=dt*.9;s.s+=dt*10*D}stamps=stamps.filter(s=>s.a>0);
  draw(t);if(!RM)requestAnimationFrame(tick)}
 size();if(!RM)requestAnimationFrame(tick);
}catch(e){console.warn('background off',e)}})();
S.classes.forEach(c=>c.sessions.forEach(x=>{if(x.aiState==='loading')x.aiState=''}));
S.classes.forEach(ensure);
(async()=>{try{AI.sm=window.claude&&claude.use?await claude.use('sample'):null}catch(e){AI.sm=null}try{AI.mcp=window.claude&&claude.use?await claude.use('mcp'):null}catch(e){AI.mcp=null}if((AI.sm||AI.mcp)&&S.user)render()})();
render();tickTimer();showIntro();
</script>
