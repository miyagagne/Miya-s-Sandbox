name: Build Winston Desktop

# Builds installers for Windows, Mac and Linux.
# Run it from the Actions tab (Run workflow), or push a tag like winston-v1.0.0 to also publish a Release.
on:
  workflow_dispatch: {}
  push:
    tags: ['winston-v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: winston-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: winston-${{ matrix.os }}
          path: |
            winston-desktop/dist/*.exe
            winston-desktop/dist/*.dmg
            winston-desktop/dist/*.zip
            winston-desktop/dist/*.AppImage
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/winston-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
